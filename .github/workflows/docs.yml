# Documentation build & deploy
#
# - On pull requests: validates the docs build (no deploy)
# - On push to main: builds and deploys to GitHub Pages
#
# The Pages deploy is skipped on private repositories: GitHub Pages isn't
# available for private repos on free plans, so the deploy would fail at
# actions/configure-pages. The docs build itself still runs everywhere.
#
# Build runs inside the devcontainer (same as CI) using `task docs:build`.

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'

# Allow only one concurrent deployment; don't cancel PR builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# pages: write and id-token: write only needed for deploy (push to main).
# PRs only need contents: read and packages: read.
permissions:
  contents: read
  pages: write
  id-token: write
  packages: read # Pull the devcontainer image from GHCR

env:
  DEVCONTAINER_IMAGE: ghcr.io/ff-fab/concept2mqtt-devcontainer

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare runner for devcontainer
        run: mkdir -p ~/.ssh

      - name: Log in to GHCR (for devcontainer cache)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation inside devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          # Read by devcontainer.json's build.args via ${localEnv:...} — skips
          # installing Claude Code on a cache-miss rebuild since CI never
          # invokes `claude`. Local devcontainer builds default to installing it.
          INSTALL_CLAUDE_CODE: 'false'
        with:
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          runCmd: task docs:build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.event.repository.private == false
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # Pages isn't available on private repos (free plan) — skip the deploy
    # there; the build job above still validates the docs.
    if: github.event_name == 'push' && github.event.repository.private == false
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
